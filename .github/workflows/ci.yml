name: LOW CI
on:
  push:
    branches: ["main", "feature/low-operating-system"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: low-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
