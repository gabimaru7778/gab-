<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>Acceso · LOW ONE</title><style>:root{color-scheme:dark;font-family:system-ui;background:#09090d;color:#f4f0fb}*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:radial-gradient(ellipse at 50% 0%,#302044,transparent 55%),#09090d}.panel{width:min(100%,420px);padding:30px;border:1px solid #393044;border-radius:22px;background:#15121de8}h1{margin:0 0 8px;font-size:30px}p{color:#aaa1b8}label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #40364c;border-radius:11px;background:#0e0c13;color:white;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:#9b78e8;color:#120d1b;font-weight:700}button.secondary{background:transparent;color:#d9c9ff;border:1px solid #504267;margin-top:9px}#msg{color:#ffb4b4;min-height:22px}</style></head><body><main class="panel"><small style="color:#bda2ff;letter-spacing:3px">PERSONAL INTELLIGENCE</small><h1>LOW ONE</h1><p>Tu inteligencia. Tu propio universo.</p><label id="nl" hidden>Nombre</label><input id="name" placeholder="Tu nombre" hidden><label>Correo</label><input id="email" type="email" autocomplete="email"><label>Contraseña</label><input id="password" type="password" minlength="12" autocomplete="current-password"><p id="msg"></p><button id="go">Iniciar sesión</button><button class="secondary" id="toggle">Crear cuenta</button></main><script>let reg=false;const $=x=>document.getElementById(x);$('toggle').onclick=()=>{reg=!reg;$('nl').hidden=!reg;$('name').hidden=!reg;$('go').textContent=reg?'Crear cuenta':'Iniciar sesión';$('toggle').textContent=reg?'Ya tengo cuenta':'Crear cuenta';};$('go').onclick=async()=>{try{const r=await fetch(reg?'/api/auth/register':'/api/auth/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo acceder');location.href='/';}catch(e){$('msg').textContent=e.message;}};</script></body></html>
